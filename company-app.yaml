# The app's operational contract (docs/app-contract.md, schemas/company-app.schema.json).
# ihc-app provision reads it on every push to main.
schema_version: 1

app:
  slug: __APP_SLUG__
  name: __APP_NAME__
  owner_email: __OWNER_EMAIL__
  description: Registro de despesas para reembolso (data, descrição, categoria,
    valor, observação) com aprovação do gestor e acompanhamento do status por
    quem pediu.

runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: app
  port: 8080
  healthcheck:
    type: http
    path: /health
    expected_status: 200

deploy:
  enabled: true
  domain: __APP_DOMAIN__
  port: auto
  env_example: .env.example

auth:
  required: true
  provider: forward-auth

database:
  required: true
  engine: postgres
  migrations_command: alembic upgrade head

dependencies:
  redis:
    required: false

# Files (uploads, exports): set true for a bucket of the app's own on the shared S3 storage
# (the cloud's storage profile must be on). The deploy writes S3_ENDPOINT, S3_BUCKET,
# S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY, S3_REGION into the app's env (README.md, "Files").
object_storage:
  required: false

# Tools for AI agents through the cloud's MCP gateway (docs/app-contract.md, "MCP"). The
# gateway lists GET tools_path and calls POST execute_path on this app's container with an
# actor JWT (aud = audience, scope = the scopes below granted to the caller's groups);
# backend/app/mcp.py checks it. In the gateway the tools are named <slug>__<tool>.
# Keep this provider enabled and at least one declared read tool.
mcp:
  audience: __APP_SLUG__.mcp
  tools_path: /mcp/tools
  execute_path: /mcp/tools/{tool}/execute
  scopes:
    __APP_SLUG__.read:
      - __APP_GROUP__

  tools:
    list_my_expenses:
      access: read
    list_pending_expenses:
      access: read
      groups:
        - ihc-admins
        - reembolso-gestores

checks:
  build_command: docker compose build
  test_command: cd backend && python -m pytest -q
